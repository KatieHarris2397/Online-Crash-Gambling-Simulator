application:
  name: warm-flare-online-crash-gambling-simulator
  pods:
    - name: backend
      image: "# filled by pipeline"
      path: /
      servicePorts:
        - 4000
      vars:
        NODE_ENV: production
        PORT: "4000"
    - name: client
      image: "# filled by pipeline"
      path: /
      servicePorts:
        - 3000
      vars:
        NODE_ENV: production
        PORT: "3000"
        REACT_APP_BACKEND_URL: "http://backend:4000"